conky.config = {
    background = true,
    update_interval = 0.1,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,
    imlib_cache_size = 0,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    minimum_width = 1265,
    minimum_height = 800,
    alignment = 'top_left',
    xinerama_head = 2,
    gap_x = 10,
    gap_y = 10,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    xftalpha = 0.8,

    default_color = '#c0c8d0',
    color0 = '#00f0ff',
    color1 = '#ff00ff',
    color2 = '#00ff88',
    color3 = '#ff8800',
    color4 = '#4488ff',
    color5 = '#778899',
    color6 = '#ff0066',
    color7 = '#aa44ff',
    color8 = '#e0e8f0',
    color9 = '#334455',

    lua_load = '/home/zozo/workspaces/zozo_ws/linux-stats-display/.config/conky/rings.lua',
    lua_draw_hook_post = 'draw_ring_stats',
};

conky.text = [[
${voffset 5}${goto 450}${font DejaVu Sans Mono:size=14}${color0}${time %A, %d %B %Y}
${goto 440}${font DejaVu Sans Mono:size=48}${color8}${time %H:%M:%S}
${voffset 160}${font DejaVu Sans Mono:size=10}${goto 50}${color0}// SYSTEM
${goto 50}${color5}UPTIME   ${color8}${uptime}

${goto 50}${color0}// CPU
${goto 50}${color5}MODEL   ${color8}${execi 6000 cat /proc/cpuinfo | grep "model name" | uniq | cut -d ":" -f2}
${goto 50}${color5}LOAD    ${color2}${cpu cpu0}%  ${color0}${cpubar 6,180}
${goto 50}${color5}TEMP    ${color6}${execi 10 sensors | grep 'Tctl:' | awk '{print $2}'}
${goto 50}${color5}CORES   ${color8}${exec nproc}  ${color5}FREQ ${color8}${freq_g} GHz
${goto 50}${color5}TOP:
${goto 65}${color3}${execi 3 ps -eo comm,%cpu --sort=-%cpu --no-headers | awk '!/conky/{if(++n==1)print $1}'}  ${color8}${execi 3 ps -eo comm,%cpu --sort=-%cpu --no-headers | awk '!/conky/{if(++n==1)print $2}'}%
${goto 65}${color3}${execi 3 ps -eo comm,%cpu --sort=-%cpu --no-headers | awk '!/conky/{if(++n==2)print $1}'}  ${color8}${execi 3 ps -eo comm,%cpu --sort=-%cpu --no-headers | awk '!/conky/{if(++n==2)print $2}'}%
${goto 65}${color3}${execi 3 ps -eo comm,%cpu --sort=-%cpu --no-headers | awk '!/conky/{if(++n==3)print $1}'}  ${color8}${execi 3 ps -eo comm,%cpu --sort=-%cpu --no-headers | awk '!/conky/{if(++n==3)print $2}'}%

${goto 50}${color0}// MEMORY
${goto 50}${color5}RAM     ${color8}$mem / $memmax ${color5}(${color1}$memperc%${color5})  ${color1}${membar 6,100}
${goto 50}${color5}FREE    ${color2}${memavail}
${goto 50}${color5}SWAP    ${color8}$swap / $swapmax ${color5}(${color7}$swapperc%${color5})  ${color7}${swapbar 6,100}

${goto 50}${color0}// STORAGE
${goto 50}${color5}/       ${color8}${fs_used /} / ${fs_size /} ${color5}(${color4}${fs_used_perc /}%${color5})  ${color4}${fs_bar 6,100 /}
${goto 50}${color5}/home   ${color8}${fs_used /home} / ${fs_size /home} ${color5}(${color4}${fs_used_perc /home}%${color5})  ${color4}${fs_bar 6,100 /home}
${goto 50}${color5}/cave   ${color8}${fs_used /mnt/cave} / ${fs_size /mnt/cave} ${color5}(${color4}${fs_used_perc /mnt/cave}%${color5})  ${color4}${fs_bar 6,100 /mnt/cave}

${goto 50}${color0}// PROCESSES
${goto 50}${color5}TOTAL   ${color8}${processes}  ${color5}RUN ${color2}${running_processes}  ${color5}THR ${color8}${threads}
${goto 50}${color5}LOAD    ${color8}${loadavg 1} ${loadavg 2} ${loadavg 3}
${voffset -445}${goto 680}${color0}// GPU
${goto 680}${color5}MODEL   ${color8}${execi 3600 nvidia-smi --query-gpu=name --format=csv,noheader}
${goto 680}${color5}DRIVER  ${color8}${execi 3600 nvidia-smi --query-gpu=driver_version --format=csv,noheader}
${goto 680}${color5}USAGE   ${color2}${execi 10 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}%
${goto 680}${color5}TEMP    ${color6}${execi 10 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits}°C
${goto 680}${color5}VRAM    ${color8}${execi 5 nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits} / ${execi 3600 nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits} MiB
${goto 680}${color5}MEMCLK  ${color8}${execi 10 nvidia-smi --query-gpu=clocks.mem --format=csv,noheader,nounits} MHz
${goto 680}${color5}FAN     ${color8}${execi 10 nvidia-smi --query-gpu=fan.speed --format=csv,noheader,nounits}%
${goto 680}${color5}POWER   ${color3}${execi 10 nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits} W

${goto 680}${color0}// NETWORK
${goto 680}${color5}IP      ${color8}${if_existing /sys/class/net/wlp14s0/operstate up}${addr wlp14s0}${else}${if_existing /sys/class/net/enp6s0/operstate up}${addr enp6s0}${else}No Connection${endif}${endif}
${goto 680}${color5}TYPE    ${color8}${if_existing /sys/class/net/wlp14s0/operstate up}WiFi${else}${if_existing /sys/class/net/enp6s0/operstate up}Ethernet${else}Disconnected${endif}${endif}
${goto 680}${color5}DOWN    ${color2}${if_existing /sys/class/net/wlp14s0/operstate up}${downspeedf wlp14s0} KiB/s ${downspeedgraph wlp14s0 20,150 00f0ff ff0066}${else}${if_existing /sys/class/net/enp6s0/operstate up}${downspeedf enp6s0} KiB/s ${downspeedgraph enp6s0 20,150 00f0ff ff0066}${else}0 KiB/s${endif}${endif}
${goto 680}${color5}UP      ${color1}${if_existing /sys/class/net/wlp14s0/operstate up}${upspeedf wlp14s0} KiB/s ${upspeedgraph wlp14s0 20,150 aa44ff ff00ff}${else}${if_existing /sys/class/net/enp6s0/operstate up}${upspeedf enp6s0} KiB/s ${upspeedgraph enp6s0 20,150 aa44ff ff00ff}${else}0 KiB/s${endif}${endif}

${goto 680}${color0}// DISK I/O
${goto 680}${color5}READ    ${color2}${diskio_read}  ${diskiograph_read 20,150 00f0ff 00ff88}
${goto 680}${color5}WRITE   ${color6}${diskio_write}  ${diskiograph_write 20,150 aa44ff ff0066}

${goto 680}${color0}// DOCKER
${goto 680}${color5}ACTIVE  ${color2}${execi 10 docker ps -q 2>/dev/null | wc -l} ${color5}containers
${goto 695}${color3}${execi 10 docker ps --format '{{.Names}}' 2>/dev/null | head -1}
${goto 695}${color3}${execi 10 docker ps --format '{{.Names}}' 2>/dev/null | sed -n '2p'}
]];
